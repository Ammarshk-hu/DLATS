<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>License Application - DLATS</title>
    <link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/application-form.css">

</head>

<body>


<header>
    <div class="logo">
        <div class="logo-box">DL</div>
        <div>
            <h2>DLATS</h2>
            <p>Driving License Application Tracking System</p>
        </div>
    </div>

    <a href="dashboard.html">Back to Dashboard</a>
</header>

<main>

    <section class="application-form-page">

        <div class="application-form-box">

            <h1>Driving License Application</h1>

            <p>Enter your details to submit a new driving license application.</p>

            <form>

                <h2>Personal Details</h2>

                <label>Full Name</label>
                <input type="text" placeholder="Enter your full name">

                <label>Date of Birth</label>
                <input type="date">

                <label>Gender</label>
                <select>
                    <option value="">Select gender</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>

                <label>Phone Number</label>
                <input type="tel" placeholder="Enter your phone number">

                <label>Email Address</label>
                <input type="email" placeholder="Enter your email">

                <h2>Address Details</h2>

                <label>Address</label>
                <input type="text" placeholder="Enter your address">

                <label>City</label>
                <input type="text" placeholder="Enter your city">

                <label>State</label>
                <input type="text" placeholder="Enter your state">

                <label>Pincode</label>
                <input type="text" placeholder="Enter your pincode">

                <h2>License Details</h2>

                <label>Application Type</label>
                <select>
                    <option value="">Select application type</option>
                    <option>New Driving License</option>
                    <option>Renewal</option>
                </select>

                <label>Vehicle Class</label>
                <select>
                    <option value="">Select vehicle class</option>
                    <option>MCWG</option>
                    <option>MCWOG</option>
                    <option>LMV</option>
                    <option>HMV</option>
                </select>

                <button type="submit">Submit Application</button>

            </form>

        </div>

    </section>

</main>


</body>
</html>
